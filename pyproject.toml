[project]
name = "clipspeak"
version = "0.1.0"
description = "Local Windows clipboard speech reader"
requires-python = ">=3.12,<3.13"
dependencies = [
    "piper-tts==1.8.0",
    "onnxruntime-gpu==1.20.2",
    "numpy>=1.26,<3",
    "sounddevice==0.5.6",
    "pystray==0.19.5",
    "pedalboard==0.9.26",
]

[project.scripts]
clipspeak = "clipspeak.__main__:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv]
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
# GPU and CPU distributions share the onnxruntime namespace. The GPU wheel
# supplies both execution providers, replacing Piper's CPU-only dependency.
exclude-dependencies = ["onnxruntime"]
